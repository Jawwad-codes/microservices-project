apiVersion: apps/v1
kind: Deployment

metadata:
  name: user-service
  namespace: microservices
  labels:
    app: user-service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: user-service

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

  template:
    metadata:
      labels:
        app: user-service

    spec:
      containers:
        - name: user-service
          image: 792705600668.dkr.ecr.ap-south-1.amazonaws.com/user-service:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 4001

          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: user-secret

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 30
            periodSeconds: 10