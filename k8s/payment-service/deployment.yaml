apiVersion: apps/v1
kind: Deployment

metadata:
  name: payment-service
  namespace: microservices
  labels:
    app: payment-service

spec:
  replicas: 2

  selector:
    matchLabels:
      app: payment-service

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: payment-service

    spec:
      initContainers:
        - name: migrate
          image: 792705600668.dkr.ecr.ap-south-1.amazonaws.com/payment-service:latest
          imagePullPolicy: IfNotPresent
          command: ["npx", "prisma", "migrate", "deploy"]
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: payment-secret

      containers:
        - name: payment-service
          image: 792705600668.dkr.ecr.ap-south-1.amazonaws.com/payment-service:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 4004

          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: payment-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 4004
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 4004
            initialDelaySeconds: 20
            periodSeconds: 10