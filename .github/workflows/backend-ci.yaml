# @format
name: Backend CI

on:
  push:
    branches: [main, development] # Added develop branch
    paths:
      - "services/**"
      - ".github/workflows/ci-backend.yml"
      - "**/Dockerfile" # Added to catch Dockerfile changes
  pull_request: # Added PR trigger for testing
    branches: [main]
    paths:
      - "services/**"

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 792705600668.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          [
            user-service,
            order-service,
            payment-service,
            product-service,
            notification-service,
            api-gateway,
          ]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2 # Better way to login
        with:
          registry-type: public # Remove this if using private ECR

      - name: Generate short SHA
        id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Check if Dockerfile exists
        id: check
        run: |
          if [ -f "./services/${{ matrix.service }}/Dockerfile" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Dockerfile not found for ${{ matrix.service }}"
          fi

      - name: Build Docker image
        if: steps.check.outputs.exists == 'true' # Skip if Dockerfile missing
        run: |
          docker build \
            -t ${{ env.ECR_REGISTRY }}/${{ matrix.service }}:${{ steps.tag.outputs.tag }} \
            -t ${{ env.ECR_REGISTRY }}/${{ matrix.service }}:latest \
            -f ./services/${{ matrix.service }}/Dockerfile \
            ./services/${{ matrix.service }}

      - name: Push to ECR
        if: steps.check.outputs.exists == 'true'
        run: |
          docker push ${{ env.ECR_REGISTRY }}/${{ matrix.service }}:${{ steps.tag.outputs.tag }}
          docker push ${{ env.ECR_REGISTRY }}/${{ matrix.service }}:latest

      - name: Debug - List files
        if: failure()
        run: |
          echo "Current directory structure:"
          ls -la
          echo "Services directory:"
          ls -la ./services/ || echo "services directory not found"
