# @format

name: Backend CI

on:
  push:
    branches: [development]
    paths:
      - "Services/**"
      - ".github/workflows/backend-ci.yml"

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 792705600668.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          [
            user-service,
            order-service,
            payment-service,
            product-service,
            notification-service,
            api-gateway,
          ]
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup nodesjs
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install, Audit, & Test
        working-directory: ./Services/${{ matrix.service }}
        run: |
          npm ci
          npm audit --audit-level=high
          npm test

      - name: AWS Login
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR Login
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
          docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

      - name: Image Tag (short commit SHA)
        id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Docker image build
        run: |
          docker build \
            -t ${{ env.ECR_REGISTRY }}/${{ matrix.service }}:${{ steps.tag.outputs.tag }} \
            -t ${{ env.ECR_REGISTRY }}/${{ matrix.service }}:latest \
            ./Services/${{ matrix.service }}

      - name: Docker Image Scan Using Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        timeout-minutes: 8
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ matrix.service }}:${{ steps.tag.outputs.tag }}
          timeout: "5m"

      - name: Push Image to ECR
        run: |
          docker push ${{ env.ECR_REGISTRY }}/${{ matrix.service }}:${{ steps.tag.outputs.tag }}
          docker push ${{ env.ECR_REGISTRY }}/${{ matrix.service }}:latest
