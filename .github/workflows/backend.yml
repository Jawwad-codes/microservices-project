# @format

name: Backend CI - Local Kubernetes (Kind)

on:
  push:
    branches:
      - development

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    env:
      SERVICES: "user-service product-service order-service payment-service notification-service api-gateway"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Kind Cluster
        uses: helm/kind-action@v1
        with:
          version: v0.20.0
          cluster_name: local-cluster

      ####################################################
      # Build & Test All Services
      ####################################################
      - name: Build & Test Services
        shell: bash
        run: |
          for service in $SERVICES
          do
            echo "=============================="
            echo "Processing $service"
            echo "=============================="

            npm ci --prefix Services/$service
            npm test --prefix Services/$service -- --watchAll=false

            docker build -t $service:latest ./Services/$service

            kind load docker-image $service:latest --name local-cluster
          done

      ####################################################
      # Deploy Kubernetes Resources
      ####################################################
      - name: Create Namespace
        run: kubectl apply -f k8s/namespace/namespace.yaml

      - name: Apply Secrets
        run: kubectl apply -R -f k8s/secrets/

      - name: Apply ConfigMap
        run: kubectl apply -f k8s/configmaps/app-config.yaml

      ####################################################
      # Install NGINX Ingress
      ####################################################
      - name: Install NGINX Ingress
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml

      - name: Wait for Ingress Controller
        run: |
          kubectl rollout status deployment/ingress-nginx-controller \
            -n ingress-nginx \
            --timeout=300s

      ####################################################
      # Deploy Application
      ####################################################
      - name: Apply Kubernetes Manifests
        run: kubectl apply -R -f k8s

      ####################################################
      # Wait for Rollout
      ####################################################
      - name: Wait for Deployments
        shell: bash
        run: |
          for service in $SERVICES
          do
            echo "Waiting for $service..."

            kubectl rollout status deployment/$service \
              -n microservices \
              --timeout=300s
          done

      ####################################################
      # Debug (Always)
      ####################################################
      - name: Cluster Information
        if: always()
        run: |
          echo "========== PODS =========="
          kubectl get pods -A

          echo "========== SERVICES =========="
          kubectl get svc -A

          echo "========== ENDPOINTS =========="
          kubectl get endpoints -A

          echo "========== INGRESS =========="
          kubectl get ingress -A

      ####################################################
      # Health Check
      ####################################################
      - name: Health Check
        shell: bash
        run: |
          kubectl port-forward \
            -n ingress-nginx \
            service/ingress-nginx-controller \
            8080:80 &

          sleep 15

          curl -v --retry 10 --retry-delay 5 --fail http://localhost:8080/health

          curl -v --retry 10 --retry-delay 5 --fail http://localhost:8080/health/all

          echo "Application is healthy."

      ####################################################
      # Logs on Failure
      ####################################################
      - name: Show API Gateway Logs
        if: failure()
        run: |
          kubectl logs deployment/api-gateway \
            -n microservices \
            --tail=200 || true
