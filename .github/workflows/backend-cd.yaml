# @format

name: Backend CDs

on:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches: [development]

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-cd-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 792705600668.dkr.ecr.ap-south-1.amazonaws.com
  EKS_CLUSTER_NAME: microservices-dev
  NAMESPACE: microservices

jobs:
  check-ci-success:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Image tag nikalo (CI wale commit se)
        id: tag
        env:
          SHA_FULL: ${{ github.event.workflow_run.head_sha }}
        run: echo "tag=${SHA_FULL:0:7}" >> "$GITHUB_OUTPUT"

  # ============================================================
  # JOB: SECRETS + CONFIGMAP + INGRESS
  # ============================================================
  apply-config:
    needs: check-ci-success
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: AWS mein login karo
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: EKS cluster se connect karo
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Namespace ready karo
        run: kubectl apply -f k8s/namespace/

      - name: ConfigMap apply karo
        run: kubectl apply -f k8s/configmaps/ -n ${{ env.NAMESPACE }}

      - name: Har service ke liye secret banao/update karo
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          RDS_ENDPOINT: ${{ secrets.RDS_ENDPOINT }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          declare -A DB_MAP=(
            [user-secret]=user_db
            [order-secret]=order_db
            [payment-secret]=payment_db
            [product-secret]=product_db
            [notification-secret]=notification_db
          )
          for secret in "${!DB_MAP[@]}"; do
            db="${DB_MAP[$secret]}"
            kubectl create secret generic "$secret" \
              --namespace=${{ env.NAMESPACE }} \
              --from-literal=JWT_SECRET="$JWT_SECRET" \
              --from-literal=DATABASE_URL="postgresql://$DB_USER:$DB_PASS@$RDS_ENDPOINT:5432/${db}?schema=public" \
              --dry-run=client -o yaml | kubectl apply -f -
          done

      - name: api-gateway ke liye secret banao (DB nahi hai, sirf JWT)
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          kubectl create secret generic api-gateway-secret \
            --namespace=${{ env.NAMESPACE }} \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Ingress apply karo
        run: kubectl apply -f k8s/ingress/ -n ${{ env.NAMESPACE }}
  db-migrations:
    needs: [check-ci-success, apply-config]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        include:
          - job: user-db-init
          - job: product-db-init
          - job: order-db-init
          - job: payment-db-init
          - job: notification-db-init

    steps:
      - uses: actions/checkout@v4

      - name: AWS Login
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Connect to EKS
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.EKS_CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}

      - name: Delete old Job (if exists)
        run: |
          kubectl delete job ${{ matrix.job }} \
            -n ${{ env.NAMESPACE }} \
            --ignore-not-found=true

      - name: Apply migration Job
        run: |
          kubectl apply \
            -f k8s/jobs/${{ matrix.job }}.yaml

      - name: Wait for migration
        run: |
          kubectl wait \
            --for=condition=complete \
            job/${{ matrix.job }} \
            -n ${{ env.NAMESPACE }} \
            --timeout=300s

      - name: Show migration logs
        run: |
          kubectl logs \
            job/${{ matrix.job }} \
            -n ${{ env.NAMESPACE }}

  # ============================================================
  # JOB: DEPLOY
  # ============================================================
  deploy:
    needs: [check-ci-success, apply-config]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        service:
          [
            user-service,
            order-service,
            payment-service,
            product-service,
            notification-service,
            api-gateway,
          ]
    steps:
      - uses: actions/checkout@v4

      - name: AWS mein login karo
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: EKS cluster se connect karo
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Deployment + Service manifest apply karo
        run: |
          kubectl apply -f k8s/${{ matrix.service }}/deployment.yaml -n ${{ env.NAMESPACE }}
          kubectl apply -f k8s/${{ matrix.service }}/service.yaml -n ${{ env.NAMESPACE }}

      - name: Naya image set karo (rolling update start hoga)
        run: |
          kubectl set image deployment/${{ matrix.service }} \
            ${{ matrix.service }}=${{ env.ECR_REGISTRY }}/${{ matrix.service }}:${{ needs.check-ci-success.outputs.image_tag }} \
            -n ${{ env.NAMESPACE }}

      - name: Rollout complete hone ka wait karo
        run: kubectl rollout status deployment/${{ matrix.service }} -n ${{ env.NAMESPACE }} --timeout=180s

      - name: Agar fail ho jaye to purane version pe wapis jao
        if: failure()
        run: kubectl rollout undo deployment/${{ matrix.service }} -n ${{ env.NAMESPACE }}
